name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.3'
          cache: false
      - run: go vet ./...
      - name: Verify release command arguments
        shell: pwsh
        run: ./scripts/release-command.test.ps1
      - run: go test -shuffle=on -count=1 ./...
      - name: Build the isolated WASI guest
        env:
          GOOS: wasip1
          GOARCH: wasm
          CGO_ENABLED: '0'
        run: go build -trimpath -o "${{ runner.temp }}/docker-guest.wasm" ./cmd/docker-wasi
      - if: runner.os == 'Linux'
        run: go test -race -shuffle=on -count=1 ./...
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
