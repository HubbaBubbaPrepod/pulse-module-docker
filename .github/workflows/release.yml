name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to build and publish
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z-]+)?$') { throw 'Invalid release tag' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - working-directory: .
        run: go test -race -shuffle=on -count=1 ./...
  package:
    needs: race
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check Go
        working-directory: .
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -shuffle=on -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build archives
        shell: pwsh
        run: |
          $legacyOnly = $env:RELEASE_TAG -match '^v1\.'
          ./scripts/build.ps1 -Version $env:RELEASE_TAG -LegacyOnly:$legacyOnly
      - name: Verify immutable compatibility package and checksums
        run: node --test scripts/release.test.mjs
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts/releases -File | Where-Object { $_.Extension -in '.zip', '.json' -or $_.Name -eq 'checksums.txt' } | ForEach-Object FullName
          [string[]]$previewArgs = @()
          if ($env:RELEASE_TAG -match '-') { $previewArgs += '--prerelease' }
          gh release create $env:RELEASE_TAG @assets --verify-tag --title $env:RELEASE_TAG --generate-notes @previewArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
