name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - working-directory: .
        run: go test -race -shuffle=on -count=1 ./...
  package:
    needs: race
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Check Go
        working-directory: .
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -shuffle=on -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build archives
        shell: pwsh
        run: |
          $legacyOnly = $env:GITHUB_REF_NAME -match '^v1\.'
          ./scripts/build.ps1 -Version $env:GITHUB_REF_NAME -LegacyOnly:$legacyOnly
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts/releases -File | Where-Object { $_.Extension -in '.zip', '.json' -or $_.Name -eq 'checksums.txt' } | ForEach-Object FullName
          $previewArgs = if ($env:GITHUB_REF_NAME -match '-') { @('--prerelease') } else { @() }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title $env:GITHUB_REF_NAME --generate-notes @previewArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
